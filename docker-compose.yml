# Dedicated MySQL for local development. Running this guarantees root/root on
# localhost:3306 for every teammate, regardless of what (if anything) is
# already installed on their machine - matching the defaults baked into
# application.properties and pom.xml's liquibase-maven-plugin, so nobody has
# to touch credentials or MySQL user config to get started.
#
# Usage:
#   docker compose up -d      start it (first run creates the data volume)
#   docker compose down       stop it (data persists in the volume)
#   docker compose down -v    stop it and wipe all data
#
# If you already run MySQL locally on port 3306, stop that instance first (or
# point this project at it with MYSQL_USERNAME/MYSQL_PASSWORD in .env instead
# of using this container).
services:
  mysql:
    image: mysql:8.0
    container_name: spotlight-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
