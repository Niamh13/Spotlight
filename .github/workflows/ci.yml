name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java-tests:
    name: Java tests (unit, black-box, UAT)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs everything Maven's test phase picks up: JUnit 5 unit tests,
      # the black-box API suite (NominationApiBlackBoxTest, isolated H2),
      # and the UAT tier (RunCucumberTest, reusing the same isolated profile).
      - name: Run mvn test
        run: ./mvnw -B test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report/
          retention-days: 14
          if-no-files-found: ignore

  e2e-tests:
    name: E2E and UI/GUI (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Playwright's webServer boots the real app via `mvnw spring-boot:run`
      # on the isolated 'e2e' profile (see application-e2e.properties), so
      # this job needs a JDK too, not just Node.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
