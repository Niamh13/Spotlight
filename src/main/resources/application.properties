spring.application.name=recognition-platform

# File-based H2 (not in-memory) so the schema and data persist between
# separate commands - needed to actually verify a deploy/rollback/deploy
# cycle rather than watching it vanish the moment the JVM exits.
# Swap for Postgres when the team's database decision is finalized.
spring.datasource.url=jdbc:h2:file:./data/recognitiondb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Liquibase now owns schema creation - Hibernate only validates that the
# entity mappings match what Liquibase built, it never creates/alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
