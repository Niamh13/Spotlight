# Isolated profile for Playwright E2E/UI runs (see ../e2e/). Separate H2 file
# DB and port from the developer's normal `mvn spring-boot:run` so E2E test
# runs never collide with or pollute ./data/recognitiondb, and can run
# alongside a normal dev instance on 8080 without a port clash.
spring.datasource.url=jdbc:h2:file:./data/e2e-testdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Demo context on so the four fixed frontend personas (Calvin/Sarah/Jamie/
# Colette) see a realistic, populated app. E2E specs still establish their own
# preconditions via the UI rather than assuming seed-data dates line up with
# "this quarter" at run time - seed rows are a starting point, not a fixture.
spring.liquibase.contexts=demo

spring.h2.console.enabled=false

# Deterministic, network-free AI evaluation for repeatable E2E runs.
ai.evaluator=mock

server.port=8099
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
