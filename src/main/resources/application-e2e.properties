# Isolated profile for Playwright E2E/UI runs (see ../e2e/). Separate MySQL
# database and port from the developer's normal `mvn spring-boot:run` so E2E
# test runs never collide with or pollute recognitiondb, and can run
# alongside a normal dev instance on 8080 without a port clash.
spring.datasource.url=${MYSQL_E2E_URL:jdbc:mysql://localhost:3306/recognitiondb_e2e?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Demo context on so the four fixed frontend personas (Calvin/Sarah/Jamie/
# Colette) see a realistic, populated app. E2E specs still establish their own
# preconditions via the UI rather than assuming seed-data dates line up with
# "this quarter" at run time - seed rows are a starting point, not a fixture.
spring.liquibase.contexts=demo

# Deterministic, network-free AI evaluation for repeatable E2E runs.
ai.evaluator=mock

server.port=8099
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
