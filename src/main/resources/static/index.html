<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 Recognition</title>
<style>
  /* ------------------------------------------------------------------
     Palette. The three recognition types are a categorical set (identity,
     not magnitude), so their hues were run through the palette validator
     rather than eyeballed:
       light  #6C4BD8 / #0F9E8E / #F97316  — all gates pass
       dark   #6C4BD8 / #0F9E8E / #E06A10  — brand orange is above the dark
                                             lightness band, so it steps down
     Light-mode orange sits at 2.8:1 on white (below 3:1), so anything it
     colours ships with a visible label or a table view alongside it.
     ------------------------------------------------------------------ */
  :root {
    color-scheme: light;
    --page:       #F5F6F8;
    --surface:    #FFFFFF;
    --surface-2:  #F9FAFB;
    --ink:        #101828;
    --ink-2:      #475467;
    --muted:      #98A2B3;
    --border:     #E4E7EC;
    --grid:       #EAECF0;
    --field:      #FFFFFF;

    --brand:      #0F9E8E;
    --star:       #6C4BD8;
    --praise:     #0F9E8E;
    --mtm:        #F97316;

    --good:       #0ca30c;
    --warning:    #fab219;
    --critical:   #d03b3b;
    --info:       #2a78d6;

    --star-soft:   #F1EDFD;
    --praise-soft: #E6F6F3;
    --mtm-soft:    #FEF0E6;
    --shadow: 0 1px 2px rgba(16,24,40,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:      #0C0D0E;
      --surface:   #1a1a19;
      --surface-2: #202022;
      --ink:       #FFFFFF;
      --ink-2:     #C3C2B7;
      --muted:     #898781;
      --border:    rgba(255,255,255,0.11);
      --grid:      #2C2C2A;
      --field:     #121212;
      --mtm:       #E06A10;
      --star-soft:   #241d3d;
      --praise-soft: #10312c;
      --mtm-soft:    #2e1d10;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  a { color: var(--brand); }
  .spacer { flex: 1 1 auto; }
  .muted { color: var(--muted); }
  .sub { color: var(--ink-2); }

  /* ---------------- app frame ---------------- */
  .app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100%; }

  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 20px 18px 18px; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 8px; background: var(--brand);
    color: #fff; font-weight: 700; font-size: 14px;
    display: grid; place-items: center; letter-spacing: -0.02em;
  }
  .logo .word { font-size: 11.5px; letter-spacing: 0.14em; color: var(--ink-2); font-weight: 600; }

  nav { padding: 4px 10px; overflow-y: auto; flex: 1 1 auto; }
  nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; margin-bottom: 2px; border-radius: 8px;
    color: var(--ink-2); text-decoration: none; font-size: 13.5px;
  }
  nav a:hover { background: var(--surface-2); color: var(--ink); }
  nav a.active { background: var(--praise-soft); color: var(--brand); font-weight: 600; }
  nav a .ic { width: 17px; text-align: center; flex: none; opacity: 0.85; }
  nav .navgroup {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); padding: 14px 10px 5px;
  }

  .whoami {
    border-top: 1px solid var(--border); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .whoami .name { font-size: 13px; font-weight: 500; }
  .whoami .role { font-size: 11.5px; color: var(--muted); }

  main { padding: 26px 30px 60px; max-width: 1320px; }

  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 21px; }
  .page-head p { margin: 4px 0 0; color: var(--ink-2); }
  .head-row { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }

  /* ---------------- status of a screen ---------------- */
  .tag {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    letter-spacing: 0.01em;
  }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; }
  .tag.live { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--ink); }
  .tag.live .dot { background: var(--good); }
  .tag.shell { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); color: var(--ink); }
  .tag.shell .dot { background: #9a6a00; }
  .tag.sample {
    background: transparent; border: 1px dashed var(--muted); color: var(--muted);
    font-weight: 500;
  }

  .notice {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px dashed color-mix(in srgb, var(--warning) 55%, var(--border));
    background: color-mix(in srgb, var(--warning) 9%, var(--surface));
    border-radius: 10px; padding: 11px 14px; margin-bottom: 18px; font-size: 13px;
  }
  .notice .glyph { color: #9a6a00; flex: none; }
  @media (prefers-color-scheme: dark) { .notice .glyph { color: var(--warning); } }
  .notice b { font-weight: 600; }

  /* ---------------- cards ---------------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .card > header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .card > header h2 { font-size: 14.5px; }
  .card > header .ep {
    font-size: 11.5px; color: var(--muted);
    font-family: ui-monospace, Consolas, monospace;
  }
  .card .body { padding: 18px; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; align-items: start; }
  .grid-main { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; align-items: start; }

  /* ---------------- home chooser ---------------- */
  .chooser { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .choice {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; box-shadow: var(--shadow);
  }
  .choice .badge {
    width: 62px; height: 62px; border-radius: 14px; display: grid; place-items: center;
    font-size: 27px; margin-bottom: 14px;
  }
  .choice.star   .badge { background: var(--star-soft);   color: var(--star); }
  .choice.praise .badge { background: var(--praise-soft); color: var(--praise); }
  .choice.mtm    .badge { background: var(--mtm-soft);    color: #b4530a; }
  @media (prefers-color-scheme: dark) { .choice.mtm .badge { color: var(--mtm); } }
  .choice h3 { font-size: 15px; margin-bottom: 6px; }
  .choice p { margin: 0 0 16px; color: var(--ink-2); font-size: 13px; flex: 1 1 auto; }

  /* ---------------- buttons ---------------- */
  button, .btn {
    cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 500;
    border-radius: 8px; padding: 9px 15px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); text-decoration: none;
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  }
  button:hover, .btn:hover { border-color: var(--muted); }
  .btn-star   { background: var(--star);   border-color: var(--star);   color: #fff; }
  .btn-praise { background: var(--praise); border-color: var(--praise); color: #fff; }
  .btn-mtm    { background: var(--mtm);    border-color: var(--mtm);    color: #fff; }
  .btn-star:hover, .btn-praise:hover, .btn-mtm:hover { filter: brightness(1.08); border-color: transparent; }
  button:disabled { opacity: 0.5; cursor: default; }
  .linkish {
    background: none; border: none; padding: 2px 0; color: var(--brand);
    font-size: 13px; text-decoration: underline; text-underline-offset: 2px;
  }
  .btn-sm { padding: 6px 11px; font-size: 12.5px; }

  /* ---------------- forms ---------------- */
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 5px; }
  .req { color: var(--critical); }
  input[type=text], input[type=email], textarea, select {
    width: 100%; padding: 9px 11px; font-family: inherit; font-size: 13.5px;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
  }
  textarea { resize: vertical; min-height: 92px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .counter { text-align: right; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .err { display: none; margin-top: 4px; font-size: 12px; color: var(--critical); }
  .field.invalid input, .field.invalid textarea { border-color: var(--critical); }
  .field.invalid .err { display: block; }
  .form-actions {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding-top: 6px; border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12.5px; cursor: pointer; color: var(--ink-2);
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--praise-soft); border-color: var(--praise); color: var(--brand); font-weight: 600; }

  .helper { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .helper h4 { font-size: 13px; margin-bottom: 10px; }
  .helper ul { margin: 0 0 12px; padding-left: 17px; color: var(--ink-2); font-size: 12.5px; }
  .helper li { margin-bottom: 4px; }

  /* ---------------- banners ---------------- */
  .banner {
    display: none; gap: 10px; align-items: flex-start; padding: 11px 14px;
    border-radius: 9px; font-size: 13px; margin-bottom: 16px; border: 1px solid var(--border);
  }
  .banner.show { display: flex; }
  .banner .glyph { flex: none; }
  .banner.ok  { background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
  .banner.ok  .glyph { color: var(--good); }
  .banner.bad { background: color-mix(in srgb, var(--critical) 11%, var(--surface)); }
  .banner.bad .glyph { color: var(--critical); }
  .banner code { font-size: 12px; word-break: break-all; }

  /* ---------------- avatars ---------------- */
  .av {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid;
    place-items: center; font-size: 12px; font-weight: 600; color: #fff;
  }
  .av.sm { width: 28px; height: 28px; font-size: 11px; }

  /* ---------------- tables ---------------- */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--muted); padding: 10px 18px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 12px 18px; border-bottom: 1px solid var(--grid); }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--surface-2); }
  tbody tr.selected { background: var(--praise-soft); }
  td.nowrap { white-space: nowrap; }
  td.when { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  /* status pills: colour + glyph + word, never colour alone */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; color: var(--ink);
  }
  .pill .g { font-size: 10.5px; }
  .pill.pending   { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); }
  .pill.pending  .g { color: #8a6000; }
  .pill.approved, .pill.delivered { background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
  .pill.approved .g, .pill.delivered .g { color: var(--good); }
  .pill.rejected, .pill.declined { background: color-mix(in srgb, var(--critical) 15%, var(--surface)); }
  .pill.rejected .g, .pill.declined .g { color: var(--critical); }
  .pill.progress  { background: color-mix(in srgb, var(--info) 15%, var(--surface)); }
  .pill.progress .g { color: var(--info); }
  @media (prefers-color-scheme: dark) { .pill.pending .g { color: var(--warning); } }

  .empty { padding: 40px 18px; text-align: center; color: var(--muted); }

  /* ---------------- detail ---------------- */
  #detail { display: none; border-top: 1px solid var(--border); padding: 18px; }
  #detail.show { display: block; }
  .prose { margin-bottom: 14px; }
  .k { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .v { margin-top: 3px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px 18px; }
  .meta .v { font-size: 12.5px; word-break: break-all; }

  /* ---------------- feed / wall ---------------- */
  .wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .praise-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 16px; display: flex; flex-direction: column; box-shadow: var(--shadow);
  }
  .praise-card .top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .praise-card .from { font-size: 13px; font-weight: 600; }
  .praise-card .to { font-size: 12px; color: var(--muted); }
  .praise-card .msg { font-size: 13px; color: var(--ink-2); flex: 1 1 auto; margin-bottom: 12px; }
  .valchip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px;
    padding: 3px 10px; border-radius: 999px; background: var(--praise-soft); color: var(--brand);
  }
  .praise-card .foot {
    display: flex; align-items: center; gap: 16px; padding-top: 11px;
    border-top: 1px solid var(--grid); margin-top: 11px; color: var(--muted); font-size: 12.5px;
  }

  .feed-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--grid); }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 15px; }
  .feed-item .txt { flex: 1 1 auto; min-width: 0; }
  .feed-item .txt .l1 { font-size: 13.5px; }
  .feed-item .txt .l2 { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  .feed-item .ago { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ---------------- tabs & filters ---------------- */
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    border: 1px solid transparent; background: none; color: var(--ink-2);
  }
  .tab:hover { background: var(--surface-2); }
  .tab.on { background: var(--brand); color: #fff; font-weight: 600; }

  /* ---------------- KPI ---------------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(184px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 17px; box-shadow: var(--shadow); border-top: 3px solid var(--border);
  }
  .kpi.k-star   { border-top-color: var(--star); }
  .kpi.k-praise { border-top-color: var(--praise); }
  .kpi.k-mtm    { border-top-color: var(--mtm); }
  .kpi.k-total  { border-top-color: var(--info); }
  .kpi .lab { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .kpi .val { font-size: 34px; font-weight: 600; letter-spacing: -0.025em; margin-top: 4px; }
  .kpi .foot { margin-top: 6px; font-size: 12px; }

  /* ---------------- charts ---------------- */
  .charts { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); gap: 16px; margin-bottom: 18px; }
  .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .legend .key { display: inline-flex; align-items: center; gap: 7px; }
  .legend .line { width: 14px; height: 2px; border-radius: 1px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .tablemini { width: 100%; min-width: 0; font-size: 12.5px; }
  .tablemini th, .tablemini td { padding: 6px 8px; }
  .tablemini td { font-variant-numeric: tabular-nums; }
  .share-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .share-row .nm { flex: 1 1 auto; }
  .share-row .vl { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------------- api log ---------------- */
  details.api { margin-top: 22px; }
  details.api summary { cursor: pointer; color: var(--ink-2); font-size: 13px; padding: 6px 0; }
  pre.log {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; overflow-x: auto; font-size: 12px; line-height: 1.6;
    color: var(--ink-2); max-height: 300px; margin: 6px 0 0;
    font-family: ui-monospace, Consolas, monospace;
  }
  pre.log .mv { color: var(--info); font-weight: 600; }
  pre.log .ok { color: var(--good); font-weight: 600; }
  pre.log .no { color: var(--critical); font-weight: 600; }

  @media (max-width: 1180px) {
    .grid-main, .grid2 { grid-template-columns: 1fr; }
    .wall { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; }
    aside nav { display: flex; gap: 4px; padding: 8px; }
    aside nav .navgroup, .whoami { display: none; }
    nav a { white-space: nowrap; }
    main { padding: 18px 16px 48px; }
    .chooser, .kpis, .wall { grid-template-columns: 1fr; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <aside>
    <div class="logo">
      <div class="mark">V1</div>
      <div class="word">RECOGNITION</div>
    </div>
    <nav id="nav"></nav>
    <div class="whoami">
      <div class="av" style="background:#6C4BD8">DU</div>
      <div>
        <div class="name">Demo user</div>
        <div class="role">No sign-in yet</div>
      </div>
    </div>
  </aside>

  <main id="view"></main>
</div>

<script>
(function () {
  "use strict";

  /* =================================================================
     Which screens are real.

     LIVE  — talks to the Spring Boot API that exists today.
     SHELL — layout only. The backend has no Praise or MomentThatMatter
             entity, no users, no likes/comments and no coordinator
             actions, so everything on these screens is sample content
             and is labelled as such on the screen itself.
     ================================================================= */
  var API = "/api/nominations";

  var ROUTES = [
    { id: "home",      label: "Home",                 ic: "⌂", live: true  },
    { id: "submit",    label: "Submit Recognition",   ic: "✎", live: true  },
    { id: "mine",      label: "My Recognition",       ic: "★", live: true  },
    { id: "praises",   label: "Praises Wall",         ic: "♡", live: false },
    { id: "stars",     label: "Star Awards",          ic: "✦", live: true  },
    { id: "mtm",       label: "Moments that Matter",  ic: "🎁", live: false },
    { id: "dashboard", label: "Dashboard",            ic: "▦", live: false },
    { id: "reports",   label: "Reports",              ic: "▤", live: false },
    { id: "help",      label: "Help & Guidelines",    ic: "?", live: true  }
  ];

  var VALUES = ["Customer Success", "Innovation", "Collaboration",
                "Integrity", "Excellence", "Community"];

  var STATUS = {
    PENDING_REVIEW:         { cls: "pending",  g: "◔", label: "Pending review" },
    RESUBMISSION_REQUESTED: { cls: "progress", g: "↩", label: "Resubmission requested" },
    APPROVED:               { cls: "approved", g: "✓", label: "Approved" },
    REJECTED:               { cls: "rejected", g: "✕", label: "Rejected" }
  };

  var FIELDS = ["nominatorName", "nominatorEmail", "nomineeName", "nomineeEmail",
                "practice", "location", "whatText", "howText", "originalNominationId"];

  var AV_COLORS = ["#6C4BD8", "#0F9E8E", "#C2410C", "#2a78d6", "#B0448F", "#0f766e"];

  /* ---------------- utilities ---------------- */

  var $ = function (s, root) { return (root || document).querySelector(s); };
  var $$ = function (s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function initials(name) {
    var p = String(name || "?").trim().split(/\s+/);
    return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  }

  function avColor(name) {
    var h = 0, s = String(name || "");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return AV_COLORS[h % AV_COLORS.length];
  }

    return '<div class="av ' + (cls || "") + '" style="background:' + avColor(name) + '">' +
           esc(initials(name)) + "</div>";
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) +
           " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function ago(iso) {
    if (!iso) return "";
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return "";
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }

    var s = STATUS[status] || { cls: "pending", g: "○", label: status || "—" };

  var logLines = [];
  function logCall(method, path, status, note) {

            ":" + String(d.getSeconds()).padStart(2, "0");
    logLines.unshift(t + '  <span class="mv">' + method + "</span> " + esc(path) +
      '  <span class="' + (status >= 200 && status < 300 ? "ok" : "no") + '">' + status + "</span>" +
      (note ? "  " + esc(note) : ""));
    if (logLines.length > 40) logLines.pop();
    var el = $("#apiLog");
    if (el) el.innerHTML = logLines.join("\n");
  }

    return '<details class="api"><summary>API activity — every request this page makes</summary>' +

  /* Multi-line trend: 3 series is categorical (identity), so each keeps its own
     validated hue. Direct end-labels only — no number on every point. */
  function trendChart() {
    var W = 560, H = 220, PL = 38, PR = 96, PT = 14, PB = 30;
    var max = 560;
    var xs = TREND.months.map(function (_, i) {
      return PL + i * (W - PL - PR) / (TREND.months.length - 1);
    });
    var y = function (v) { return PT + (1 - v / max) * (H - PT - PB); };

    var grid = "", ticks = [0, 140, 280, 420, 560];
    ticks.forEach(function (t) {
      grid += '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(t) + '" y2="' + y(t) +
        '" stroke="var(--grid)" stroke-width="1"/>' +
        '<text x="' + (PL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="10.5" ' +
        'fill="var(--muted)" style="font-variant-numeric:tabular-nums">' + t + "</text>";
    });

    var xlab = TREND.months.map(function (m, i) {
      return '<text x="' + xs[i] + '" y="' + (H - PB + 18) + '" text-anchor="middle" font-size="10.5" ' +
        'fill="var(--muted)">' + m + "</text>";
    }).join("");

    function series(vals, color, label) {
      var d = vals.map(function (v, i) { return (i ? "L" : "M") + xs[i] + " " + y(v); }).join(" ");
      var dots = vals.map(function (v, i) {
        return '<circle cx="' + xs[i] + '" cy="' + y(v) + '" r="3.2" fill="' + color +
          '" stroke="var(--surface)" stroke-width="2"><title>' + label + " · " +
          TREND.months[i] + ": " + v + "</title></circle>";
      }).join("");
      var last = vals[vals.length - 1];
      return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>' + dots +
        '<text x="' + (xs[xs.length - 1] + 10) + '" y="' + (y(last) + 4) + '" font-size="11" ' +
        'fill="var(--ink-2)">' + label + " " + last + "</text>";
    }

    return '<svg class="chart-svg" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
      'aria-label="Recognition volume by type over six months (sample data)">' +
      grid + xlab +
      '<line x1="' + PL + '" x2="' + PL + '" y1="' + PT + '" y2="' + (H - PB) +
        '" stroke="var(--border)" stroke-width="1"/>' +
      series(TREND.praise, "var(--praise)", "Praises") +
      series(TREND.star, "var(--star)", "Star") +
      series(TREND.mtm, "var(--mtm)", "MtM") +
      "</svg>";
  }

  function trendTable() {
    return '<div class="tablewrap"><table class="tablemini" style="min-width:0"><thead><tr><th>Month</th>' +
      "<th>Star Awards</th><th>Praises</th><th>MtM</th></tr></thead><tbody>" +
      TREND.months.map(function (m, i) {
        return "<tr><td>" + m + "</td><td>" + TREND.star[i] + "</td><td>" +
          TREND.praise[i] + "</td><td>" + TREND.mtm[i] + "</td></tr>";

  /* Part-to-whole. The mockup used a donut, but its two largest slices are
     45% and 40% — close values a ring makes you squint at. A single stacked
     bar with the numbers written out reads at a glance and gives the
     light-mode orange the visible label its contrast needs. */
  function shareBar() {
    var parts = [
      { label: "Praises", value: 250, pct: 40, color: "var(--praise)" },
      { label: "Star Awards", value: 282, pct: 45, color: "var(--star)" },
      { label: "Moments that Matter", value: 94, pct: 15, color: "var(--mtm)" }
    ];
    var bar = '<div style="display:flex;gap:2px;height:34px;margin-bottom:16px">' +
      parts.map(function (p, i) {
        var r = i === 0 ? "6px 0 0 6px" : (i === parts.length - 1 ? "0 6px 6px 0" : "0");
        return '<div style="flex:' + p.pct + ';background:' + p.color + ';border-radius:' + r + '"></div>';
      }).join("") + "</div>";
    var rows = parts.map(function (p) {
      return '<div class="share-row"><span class="sw" style="width:10px;height:10px;border-radius:3px;' +
        "background:" + p.color + ';display:inline-block"></span>' +
        '<span class="nm">' + esc(p.label) + "</span>" +
        '<span class="vl">' + p.value + "</span>" +
        '<span class="muted" style="width:38px;text-align:right">' + p.pct + "%</span></div>";
    }).join("");
    return bar + rows;
  }

  /* The completeness evaluation, and the action it enables. */
  function evaluationPanel(n) {
    var ev = n.evaluation;
    if (!ev) return "";

    var sentBlock = (lastSent && lastSent.id === n.id)
      ? '<div style="margin-top:12px"><div class="k">Message sent to ' +
        esc(lastSent.recipient) + "</div>" +
        '<pre class="log" style="white-space:pre-wrap;max-height:260px">' +
        esc(lastSent.message) + "</pre></div>"
      : "";

    if (ev.complete) {
      return '<div class="notice" style="border-style:solid;border-color:' +
        "color-mix(in srgb, var(--good) 40%, var(--border));background:" +
        'color-mix(in srgb, var(--good) 9%, var(--surface))">' +
        '<span class="glyph" style="color:var(--good)">✓</span>' +
        "<div>Evaluation found no gaps — this is ready to review.</div></div>";
    }

    var list = ev.failingCriteria.map(function (c) {
      return '<li style="margin-bottom:7px"><b>' + esc(c.gap) + "</b><br>" +
        '<span class="muted" style="font-size:12.5px">' + esc(c.remedy) + "</span></li>";
    }).join("");

    var already = n.status === "RESUBMISSION_REQUESTED";
    var action = already
      ? '<span class="muted" style="font-size:12.5px">Requested ' + esc(fmtDate(n.commsSentDate)) + "</span>"
      : '<button class="btn-mtm btn-sm" id="reqResub" data-id="' + esc(n.id) + '">' +
        "Request resubmission</button>" +
        '<span class="muted" style="font-size:12.5px">Sends ' + esc(n.nominatorName) +
        " a message listing these " + ev.failingCriteria.length + " points</span>";

    return '<div class="notice" style="display:block">' +
      '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">' +
        '<span class="glyph">▲</span><b>Evaluation flagged ' + ev.failingCriteria.length +
        (ev.failingCriteria.length === 1 ? " gap" : " gaps") + "</b></div>" +
      '<ul style="margin:0 0 12px;padding-left:30px">' + list + "</ul>" +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-left:20px">' +
        action + "</div>" +
      '<div id="resubResult" style="padding-left:20px">' + sentBlock + "</div></div>";

          return r.json().then(function (b) { return { ok: r.ok, body: b }; });

              esc(res.body.error || "Request failed") + "</div>";

          // stamp rather than the state it was opened in. lastSent keeps the
          // message on screen across that rebuild.

  function wireForm() {
    var form = $("#form");

    function hideBanners() {
      $("#okBanner").className = "banner ok";
      $("#badBanner").className = "banner bad";
    }
    function clearErrors() {
      $$("[data-field]").forEach(function (w) {
        w.classList.remove("invalid");
        var e = $(".err", w); if (e) e.textContent = "";
      });
    }
    function fill(v) { Object.keys(v).forEach(function (k) { if ($("#" + k)) $("#" + k).value = v[k]; }); }

    $("#sampleBtn").addEventListener("click", function () {
      hideBanners(); clearErrors();
      fill({ nominatorName: "Jamie Doyle", nominatorEmail: "jamie.doyle@version1.com",
             nomineeName: "Alex Rivera", nomineeEmail: "alex.rivera@version1.com",
             practice: "Cloud Engineering", location: "Dublin",
             whatText: "Led the release rollout over a tight weekend.",
             howText: "Demonstrated ownership by keeping the whole team calm and coordinated under pressure." });
    });

    $("#selfBtn").addEventListener("click", function () {
      hideBanners(); clearErrors();
      fill({ nominatorName: "Jamie Doyle", nominatorEmail: "jamie.doyle@version1.com",
             nomineeName: "Jamie Doyle", nomineeEmail: "jamie.doyle@version1.com",
             practice: "Cloud Engineering", location: "Dublin",
             whatText: "Kept the release on track.", howText: "Showed ownership throughout." });
    });

    $("#clearBtn").addEventListener("click", function () { form.reset(); hideBanners(); clearErrors(); });
    $("#resubBtn").addEventListener("click", function () {
      var w = $("#resubWrap"); w.hidden = !w.hidden;
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      hideBanners(); clearErrors();
      $("#submitBtn").disabled = true;

      var payload = {};
      FIELDS.forEach(function (f) {
        var el = $("#" + f);
        if (!el) return;
        if (f === "originalNominationId") { if (el.value.trim()) payload[f] = el.value.trim(); }
        else payload[f] = el.value;   // blanks included, so the API decides
      });

      fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(function (r) {
          return r.json().then(function (b) { return { status: r.status, ok: r.ok, body: b }; })
                         .catch(function () { return { status: r.status, ok: r.ok, body: {} }; });
        })
        .then(function (res) {
          logCall("POST", "/api/nominations", res.status, res.ok ? "created" : "rejected by validation");
          if (res.ok) {
            $("#okText").innerHTML = "Star Award submitted — <code>" + esc(res.body.id) + "</code>";
            $("#okBanner").className = "banner ok show";
            form.reset();
            $("#resubWrap").hidden = true;
            return loadNominations();
          }
          if (res.body && res.body.error) {
            $("#badText").textContent = res.body.error;
          } else if (res.body && typeof res.body === "object") {
            var keys = Object.keys(res.body);
            keys.forEach(function (k) {
              var w = $('[data-field="' + k + '"]');
              if (w) { w.classList.add("invalid"); $(".err", w).textContent = res.body[k]; }
            });
            $("#badText").textContent = "The API rejected this submission — " + keys.length +
              (keys.length === 1 ? " field failed" : " fields failed") + " validation.";
          } else {
            $("#badText").textContent = "Request failed with HTTP " + res.status + ".";
          }
          $("#badBanner").className = "banner bad show";
        })
        .catch(function (e) {
          $("#badText").textContent = "Couldn't reach the API — " + e.message;
          $("#badBanner").className = "banner bad show";
        })
        .finally(function () { $("#submitBtn").disabled = false; });
    });
  }

    });
    wireChips("#prValues", false, function (on) {
      $("#prPrevVals").innerHTML = on.map(function (v) {
        return '<span class="valchip">◎ ' + esc(v) + "</span> ";
      }).join("");
    });
  }

  function wireChips(sel, single, onChange) {
    var root = $(sel);
    if (!root) return;
    $$(".chip", root).forEach(function (c) {
      c.addEventListener("click", function () {
        if (single) $$(".chip", root).forEach(function (x) { x.classList.remove("on"); });
        c.classList.toggle("on");
        if (onChange) {
          onChange($$(".chip.on", root).map(function (x) { return x.getAttribute("data-v") || x.textContent.trim(); }));
        }
      });
    });
  }

  /* ---------------- boot ---------------- */
  window.addEventListener("hashchange", render);
  loadNominations().then(render);
})();
</script>
</body>
</html>
