# Isolated profile for black-box API tests: own MySQL database, schema-only
# (no demo context), so tests never touch the developer's real recognitiondb
# database. Unlike the old in-memory H2 (fresh per JVM run for free), a
# persistent MySQL server needs an explicit reset for a fresh starting
# schema each run - see the liquibase-maven-plugin's reset-blackbox-database
# execution in pom.xml, bound to run before every `mvn test`.
spring.datasource.url=${MYSQL_BLACKBOX_URL:jdbc:mysql://localhost:3306/recognitiondb_blackbox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Empty on purpose: only changeset 005 is tagged context="demo", so leaving
# this blank applies every schema changeset but skips the seeded demo rows -
# black-box tests build their own fixtures instead of depending on seed data.
spring.liquibase.contexts=

# Deterministic, network-free AI evaluation - no GROQ_API_KEY in CI/local test
# runs, and a real network call would make these tests slow and flaky.
ai.evaluator=mock
